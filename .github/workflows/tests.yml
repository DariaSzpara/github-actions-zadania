name: Grades Tests

on: [push, pull_request]  

jobs: 
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repsoistory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Run tests
        run: pytest -v
